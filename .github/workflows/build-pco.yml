name: Build PCO Optimization App

on:
  push:
    paths: ["pco-optimizer/**", ".github/workflows/build-pco.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pco-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar .exe
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: PCO_Optimization_App
          path: pco-optimizer/dist/PCO_Optimization_App.exe
